name: cnit
channels:
  - conda-forge
dependencies:
  - python >=3.9,<3.13
  # Pandoc is an external executable required by nbsphinx for notebook conversion.
  - pandoc
  - pip
  # Install CNit in editable mode. Pip reads the runtime dependencies
  # (NumPy, SciPy, xarray, netCDF4, attrs, openscm-units, and Pint) and these
  # optional groups from pyproject.toml:
  #   notebook: notebook, matplotlib
  #   docs: Sphinx, Read the Docs theme, autodoc type hints, bibtex, nbsphinx,
  #         nbconvert
  #   tests: pytest, pytest-regressions[dataframe], matplotlib
  #   lint: Ruff
  #   format: Black
  - pip:
      - "-e .[notebook,docs,tests,lint,format]"
