name: cnit
channels:
  - conda-forge
dependencies:
  - python>=3.8,<3.13
  - numpy
  - scipy
  - xarray
  - attrs
  - openscm-units >=0.5.0
  - pint >=0.19
  # Optional: Notebook dependencies
  - jupyter>=6,<7
  - matplotlib
  # Optional: Docs dependencies
  - sphinx >=1.4
  - sphinx-rtd-theme >=1.0
  - sphinx-autodoc-typehints >=1.22
  - sphinxcontrib-bibtex
  - sphinx_rtd_theme
  # Optional: Test dependencies
  - pytest
  - pytest-regressions
  # Build tools
  - pip
  - wheel
  - setuptools>=61
  # Editable pip install with all extras
  - pip:
      - nb_black
      - -e .[notebook,docs,tests]