# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "mambaforge-4.10"
  jobs:
    build:
      html:
        - python scripts/build_docs.py --output-dir "$READTHEDOCS_OUTPUT/html"

conda:
  environment: environment.yml

sphinx:
  configuration:  docs/conf.py
  fail_on_warning: false
