[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnit"
version = "2.1.0"
description = "CNit: A Coupled Carbon-Nitrogen Cycle Model (Python)"
keywords = ["cnit", "carbon cycle", "nitrogen cycle", "simple climate model", "magicc"]
authors = [
    {name="Gang Tang", email="gang.tang.au@gmail.com"},
    {name="Zeb Nicholls", email="zebedee.nicholls@climate-energy-college.org"}
]
license = {text = "TBD"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "attrs",
    "openscm-units >= 0.5.0",
    "pint >= 0.19"
]

[project.optional-dependencies]
notebook = [
    "jupyter>=6,<7",
    "matplotlib",
    "nb_black",
]
docs = [
    "sphinx >= 1.4",
    "sphinx-rtd-theme >= 1.0",
    "sphinx-autodoc-typehints >= 1.22",
    "sphinxcontrib-bibtex",
    "sphinx_rtd_theme",
]
tests = [
    "pytest",
    "pytest-regressions[dataframe]"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]